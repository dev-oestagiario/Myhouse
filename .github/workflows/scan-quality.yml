name: Verificar My House (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes de regras da planta
        run: npm run test
      - name: Compilação React e TypeScript
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android com plugin Camera
        run: npm run android:prepare
      - name: Verificar compilação nativa Android (sem publicar)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

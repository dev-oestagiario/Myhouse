name: Verificar My House (PR)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes de regras da planta
        run: npm run test
      - name: Verificar TypeScript
        run: npm run check
      - name: Compilação React e TypeScript
        run: npm run build

  android:
    # Compile-only: a verificação Android não publica nem anexa APK para distribuição.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android com plugin Camera
        run: npm run android:prepare
      - name: Verificar compilação nativa Android (sem publicar)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do teste
        run: npm install --no-audit --no-fund
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Fluxos reais de interface com Supabase simulado
        run: npm run e2e
      - name: Guardar relatório somente quando necessário
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myhouse-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  postgres:
    name: Migrar HomeData V1/V2 com dados sintéticos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myhouse_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myhouse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: integration_test_only
      PGDATABASE: myhouse_ci
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Simular a migração V1 para V2 e rejeição de documentos inválidos
        run: psql -X -v ON_ERROR_STOP=1 -f database/tests/verify-v2-migration.sql
      - name: Testar isolamento Storage com duas identidades sintéticas
        run: |
          createdb myhouse_storage_ci
          PGDATABASE=myhouse_storage_ci psql -X -v ON_ERROR_STOP=1 -f database/tests/verify-storage-rls.sql

  mobile-acceptance-apk:
    # Debug download only after all four quality jobs on mobile acceptance/hotfix PRs.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/f76-mobile-acceptance' || github.head_ref == 'fix/android-native-mobile-layout')
    needs: [react, android, e2e, postgres]
    uses: ./.github/workflows/android-apk.yml

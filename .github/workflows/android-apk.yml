name: Gerar APK Android - My House

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: myhouse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://peijhetajeuiqomvfseg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_d5MAuGIEo7vjdYeO2ioMUA_PbByLUNd
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK (ferramentas 20.0)
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar regras de escaneamento
        run: npm run test
      - name: Compilar web e gerar projeto Android com ícone personalizado
        run: npm run android:prepare
      - name: Gerar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verificar e empacotar APK de teste
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tqq "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          mkdir -p release
          cp "$apk" release/MyHouse-F7-debug.apk
          (cd release && sha256sum MyHouse-F7-debug.apk > SHA256SUMS.txt)
          cp dist/build-performance.json release/build-performance.json
          printf '%s\n' 'APK DEBUG: uso de teste, não release estável.' 'Configuração do Supabase existente. Use dados de teste autorizados.' 'Não desinstale a versão anterior sem backup verificado; a assinatura debug pode ser diferente.' 'Commit: ${{ github.sha }}' > release/LEIA-ME.txt
      - name: Disponibilizar APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: myhouse-f7-android-debug
          path: release/
          if-no-files-found: error
          retention-days: 30

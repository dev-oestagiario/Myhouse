name: Gerar APK Android - My House

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: myhouse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # Build solicitado, somente nesta branch de distribuição de teste; sem release pública.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'build/f68-apk-debug-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://peijhetajeuiqomvfseg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_d5MAuGIEo7vjdYeO2ioMUA_PbByLUNd
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK (ferramentas 20.0)
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar regras de escaneamento
        run: npm run test
      - name: Compilar web e gerar projeto Android com ícone personalizado
        run: npm run android:prepare
      - name: Gerar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verificar integridade e assinatura debug
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tqq "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          mkdir -p release
          cp "$apk" release/MyHouse-F6.8-debug.apk
          (cd release && sha256sum MyHouse-F6.8-debug.apk > SHA256SUMS.txt)
          printf '%s\n' 'MyHouse F6.8 - APK debug para QA' 'Base develop: 0f5120e0915bda0399cd354502a05d43b91efaf5' 'Nao e release estavel. Banco V1 e anexos ainda pendentes; nao utilizar com dados de producao. Assinatura debug pode diferir da versao anterior.' > release/LEIA-ME.txt
          du -h release/MyHouse-F6.8-debug.apk
          cat release/SHA256SUMS.txt
      - name: Disponibilizar APK de teste no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MyHouse-F6.8-debug
          path: release/
          if-no-files-found: error
          retention-days: 30

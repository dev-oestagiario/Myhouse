name: Gerar APK Android - My House

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # Permite criar Releases e anexar APK usando GITHUB_TOKEN

concurrency:
  group: myhouse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://peijhetajeuiqomvfseg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_d5MAuGIEo7vjdYeO2ioMUA_PbByLUNd
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK (ferramentas 20.0)
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar web e gerar projeto Android com ícone personalizado
        run: npm run android:prepare
      - name: Gerar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: myhouse-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verificar integridade do APK e preparar download
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tqq android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MyHouse.apk
          (cd release && sha256sum MyHouse.apk > MyHouse.apk.sha256)

      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-v0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > release/NOTES.md <<EOF
          **My House — Android (versão de testes)**

          Baixe **MyHouse.apk** abaixo para instalar no Android.

          - Build: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Gerado automaticamente após build e verificação do APK.
          - APK de desenvolvimento (debug), não destinado à Google Play.

          **Atenção:** builds de teste podem ter assinaturas Android diferentes. Se a atualização não instalar sobre a anterior, confirme o salvamento na nuvem, faça um backup e só então reinstale.
          EOF
          gh release create "$RELEASE_TAG" \
            release/MyHouse.apk \
            release/MyHouse.apk.sha256 \
            --title "My House — APK Android (build ${{ github.run_number }})" \
            --notes-file release/NOTES.md \
            --latest
